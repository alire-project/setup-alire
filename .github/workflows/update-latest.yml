name: Update latest branch

on:
  push:
    branches:
      - 'v[0-9]+'
      - 'v[0-9]+.[0-9]+'

jobs:
  update-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push latest to match ${{ github.ref_name }}
        run: git push origin HEAD:latest --force
